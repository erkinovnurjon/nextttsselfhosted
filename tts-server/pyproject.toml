[project]
name = "nexttts-server"
version = "0.1.0"
description = "NextTTS — Python ML server: XTTS v2 voice cloning + FastAPI inference"
requires-python = ">=3.10,<3.12"

dependencies = [
  "coqui-tts==0.27.5",
  "transformers==4.55.0",
  "torch>=2.1.0",
  "torchaudio>=2.1.0",
  "soundfile>=0.12.1",
  "numpy>=1.24,<2.0",
  "librosa>=0.10.1",
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "python-multipart>=0.0.9",
]

[tool.uv]
# CUDA 12.1 wheels for PyTorch
extra-index-url = ["https://download.pytorch.org/whl/cu121"]
